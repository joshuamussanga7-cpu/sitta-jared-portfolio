<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#1f2937"/>
  <rect x="20" y="20" width="360" height="260" fill="#374151" rx="10"/>

  <!-- Header -->
  <text x="200" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Calculus Fundamentals</text>
  <rect x="20" y="55" width="360" height="1" fill="#4b5563"/>

  <!-- Offline indicator -->
  <rect x="30" y="65" width="80" height="20" fill="#10b981" rx="10"/>
  <circle cx="45" cy="75" r="4" fill="white"/>
  <text x="55" y="80" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="start">Offline</text>

  <!-- Note content -->
  <text x="40" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#60a5fa" text-anchor="start">Limits and Continuity</text>

  <text x="40" y="130" font-family="Arial, sans-serif" font-size="12" fill="#e5e7eb" text-anchor="start">A limit is the value that a function approaches as the input</text>
  <text x="40" y="145" font-family="Arial, sans-serif" font-size="12" fill="#e5e7eb" text-anchor="start">approaches some value. For a function f(x), the limit as</text>
  <text x="40" y="160" font-family="Arial, sans-serif" font-size="12" fill="#e5e7eb" text-anchor="start">x approaches a is L, written as:</text>

  <text x="40" y="185" font-family="Arial, sans-serif" font-size="16" fill="#fbbf24" text-anchor="start">lim (x→a) f(x) = L</text>

  <text x="40" y="210" font-family="Arial, sans-serif" font-size="12" fill="#e5e7eb" text-anchor="start">Continuity requires that the function exists at x = a,</text>
  <text x="40" y="225" font-family="Arial, sans-serif" font-size="12" fill="#e5e7eb" text-anchor="start">the limit exists, and they are equal.</text>

  <!-- Navigation -->
  <circle cx="180" cy="250" r="15" fill="#4b5563"/>
  <text x="180" y="257" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">←</text>

  <circle cx="220" cy="250" r="15" fill="#4b5563"/>
  <text x="220" y="257" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">→</text>

  <!-- Bookmark -->
  <circle cx="340" cy="250" r="15" fill="#7c3aed"/>
  <text x="340" y="257" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">☆</text>

  <text x="200" y="280" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Offline Reading • Bookmark Feature • Easy Navigation</text>
</svg>