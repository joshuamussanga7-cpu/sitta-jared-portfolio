<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#1f2937"/>
  <rect x="20" y="20" width="360" height="260" fill="#374151" rx="10"/>
  <text x="200" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Seller Dashboard</text>

  <!-- Stats -->
  <rect x="40" y="60" width="80" height="40" fill="#10b981" rx="5"/>
  <text x="80" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">12</text>
  <text x="80" y="90" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">Products</text>

  <rect x="140" y="60" width="80" height="40" fill="#f59e0b" rx="5"/>
  <text x="180" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">8</text>
  <text x="180" y="90" font-family="Arial, sans-serif" font-size="10" fill="#fef3c7" text-anchor="middle">Sold</text>

  <rect x="240" y="60" width="80" height="40" fill="#6366f1" rx="5"/>
  <text x="280" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">24</text>
  <text x="280" y="90" font-family="Arial, sans-serif" font-size="10" fill="#ddd6fe" text-anchor="middle">Views</text>

  <!-- Product list -->
  <text x="40" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="start">My Products</text>

  <rect x="40" y="135" width="320" height="35" fill="#4b5563" rx="5"/>
  <rect x="50" y="145" width="25" height="25" fill="#6b7280" rx="3"/>
  <text x="85" y="152" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="start">Laptop for Sale</text>
  <text x="85" y="167" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="start">$500 • Active</text>
  <circle cx="340" cy="152" r="8" fill="#10b981"/>
  <text x="340" y="158" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">•</text>

  <rect x="40" y="180" width="320" height="35" fill="#4b5563" rx="5"/>
  <rect x="50" y="190" width="25" height="25" fill="#6b7280" rx="3"/>
  <text x="85" y="197" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="start">Textbook Bundle</text>
  <text x="85" y="212" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="start">$25 • Active</text>
  <circle cx="340" cy="197" r="8" fill="#10b981"/>
  <text x="340" y="203" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">•</text>

  <!-- Add product button -->
  <rect x="40" y="230" width="320" height="35" fill="#6366f1" rx="5"/>
  <text x="200" y="252" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">+ Add New Product</text>
</svg>