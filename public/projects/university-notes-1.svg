  <rect x="210" y="70" width="150" height="80" fill="#7c3aed" rx="8"/>
  <text x="285" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Physics</text>
  <text x="285" y="115" font-family="Arial, sans-serif" font-size="12" fill="#ddd6fe" text-anchor="middle">8 Notes</text>
  <circle cx="330" cy="110" r="8" fill="#8b5cf6"/>
  <text x="330" y="117" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">✓</text>

  <rect x="40" y="165" width="150" height="80" fill="#dc2626" rx="8"/>
  <text x="115" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Chemistry</text>
